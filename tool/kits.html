<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher's Toolkit</title>
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--ink:#1d2433;--muted:#6b7385;--line:#e2ddd0;
  --accent:#2f5bea;--accent-ink:#fff;--good:#1c8a4f;--goodbg:#e3f5ea;--bad:#c2372f;--badbg:#fbe8e6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171f;--card:#1e2330;--ink:#eef0f6;--muted:#9aa2b6;--line:#2c3345;
  --accent:#7b9bff;--accent-ink:#0f1320;--good:#5fd18f;--goodbg:#173026;--bad:#ff8a80;--badbg:#3a1d1d;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:560px;padding:max(12px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
h2{font-size:1.05rem;margin:0}
button{font:inherit;color:inherit}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:90px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs .in{display:flex;gap:6px;width:100%;max-width:560px}
.tab-btn{flex:1;border:0;background:transparent;border-radius:12px;padding:6px 4px;cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:600;line-height:1.2}
.tab-btn span{display:block;font-size:1.4rem}
.tab-btn.on{background:var(--accent);color:var(--accent-ink)}

/* shared */
.go{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:12px}
.go:disabled{opacity:.55;cursor:default}
.btn{min-height:42px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:.9rem;font-weight:600;cursor:pointer}
.btn.danger{color:var(--bad)}
.icon{width:42px;min-height:42px;flex:none;border:2px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.panel-h small{color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row input{flex:1}
.empty{color:var(--muted);text-align:center;margin:10px 0;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:6px 0}
.manage-wrap{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.manage-wrap>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.manage-wrap>summary::-webkit-details-marker{display:none}
.manage-wrap>summary::after{content:"＋";font-size:1.15rem;color:var(--accent);font-weight:800}
.manage-wrap[open]>summary::after{content:"−"}
.manage-wrap .panel{margin-top:8px}
.disabled{pointer-events:none;opacity:.55}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:.92rem;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* wheel */
.stat{text-align:center;color:var(--muted);font-size:.9rem;margin-top:6px}
.wheelwrap{position:relative;width:min(92vw,440px);aspect-ratio:1;margin:12px auto 0;user-select:none}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--ink);z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.hub{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--card);background:var(--ink);color:var(--card);font-weight:800;font-size:clamp(.7rem,3.4vw,1rem);cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hub:disabled{opacity:.6;cursor:default}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:.88rem;text-decoration:line-through;color:var(--muted)}
.pill button{border:0;background:var(--card);border-radius:50%;width:26px;height:26px;cursor:pointer}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.sheet{background:var(--card);border-radius:22px;padding:24px 20px;width:min(100%,400px);text-align:center;animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet .lab{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
.sheet .big{font-size:clamp(1.8rem,9vw,2.8rem);font-weight:800;line-height:1.15;margin:10px 0;overflow-wrap:anywhere}
.sheet .left{color:var(--muted);margin-bottom:10px}
.sheet .go{margin-top:8px}
.sheet .go.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}

/* dice */
.seg{display:flex;gap:6px;margin:6px 0 4px}
.seg button{flex:1;min-height:46px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.diceArea{display:flex;justify-content:center;gap:5vw;margin:26px 0 10px;min-height:250px;align-items:center}
.die{width:min(38vw,160px);aspect-ratio:1;background:var(--card);border:3px solid var(--ink);border-radius:22%;padding:13%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:5%;box-shadow:0 7px 0 var(--line);cursor:pointer;user-select:none}
.pip{border-radius:50%}
.pip.on{background:var(--ink)}
.die[data-v="1"] .pip.on{background:var(--bad)}
.die.rolling{animation:tumble .5s linear infinite}
@keyframes tumble{
  0%{transform:rotate(0) translateY(0) scale(1)}
  25%{transform:rotate(-25deg) translateY(-26px) scale(1.08)}
  50%{transform:rotate(18deg) translateY(0) scale(1)}
  75%{transform:rotate(-14deg) translateY(-18px) scale(1.05)}
  100%{transform:rotate(0) translateY(0) scale(1)}
}
.die.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.total{text-align:center;font-size:1.5rem;font-weight:800;min-height:2em}
.hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.hist span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;color:var(--muted)}

/* cards */
.count{text-align:center;color:var(--muted);font-size:.9rem;margin:6px 0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.flipwrap{perspective:1200px;width:100%;height:min(85vw,260px);min-height:190px;touch-action:pan-y;cursor:pointer;user-select:none}
.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flipwrap.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:0 6px 0 var(--line)}
.face.back{transform:rotateY(180deg);background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.face small{text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;opacity:.7;margin-bottom:8px}
.face .txt{font-size:clamp(1.6rem,8vw,2.5rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.hintline{text-align:center;color:var(--muted);font-size:.8rem;margin:12px 0 4px}
.navrow{display:flex;gap:10px;margin-top:8px}
.navrow button{flex:1;min-height:52px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:1.3rem;cursor:pointer}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .btn{flex:1}
.row2{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.row2 input{flex:1;width:0}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

  <!-- ================= WHEEL ================= -->
  <section id="tab-wheel">
    <div class="stat" id="wStat"></div>
    <div class="wheelwrap">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
      <button class="hub" id="hub" aria-label="Spin">SPIN</button>
    </div>
    <button class="go" id="spinBtn">🎡 Spin the wheel</button>
    <label class="toggle"><input type="checkbox" id="elim"> Remove each picked option from the wheel</label>

    <div class="panel" id="wDonePanel">
      <div class="panel-h"><h2>Already picked <small id="dCount"></small></h2><button class="btn" id="wRestore">↩ Restore all</button></div>
      <div class="pills" id="wDone"></div>
    </div>
    <details class="manage-wrap" id="wManage">
      <summary>⚙️ Manage wheel options <small id="wCount"></small></summary>
      <div class="panel" id="wPanel">
      <div class="panel-h"><h2>Options</h2></div>
      <div class="row">
        <input id="wNew" placeholder="Add an option (vocab, verb, task…)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button class="icon" id="wAdd" aria-label="Add" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">＋</button>
      </div>
      <div id="wList"></div>
      <details>
        <summary>Add many at once</summary>
        <textarea id="wBulk" placeholder="One option per line"></textarea>
        <div class="actions"><button class="btn" id="wBulkAdd">Add lines</button></div>
      </details>
      <div class="actions">
        <button class="btn" id="wCopy">📋 Copy list</button>
        <button class="btn danger" id="wClear">Clear all</button>
      </div>
    </div>

    </details>
  </section>

  <!-- ================= DICE ================= -->
  <section id="tab-dice" class="hidden">
    <div class="seg" id="diceCount">
      <button data-n="1">⚀ One die</button>
      <button data-n="2">⚀⚁ Two dice</button>
    </div>
    <div class="diceArea">
      <div class="die" id="die1"></div>
      <div class="die" id="die2"></div>
    </div>
    <div class="total" id="diceTotal"></div>
    <button class="go" id="rollBtn">🎲 Roll</button>
    <div class="hist" id="hist"></div>
  </section>

  <!-- ================= CARDS ================= -->
  <section id="tab-cards" class="hidden">
    <div class="count" id="cCount"></div>
    <div class="bar"><i id="cBar"></i></div>
    <div class="flipwrap" id="flip">
      <div class="inner">
        <div class="face front"><small id="fLab"></small><div class="txt" id="fTxt"></div></div>
        <div class="face back"><small id="bLab"></small><div class="txt" id="bTxt"></div></div>
      </div>
    </div>
    <div class="hintline">Tap the card to flip · swipe left or right for the next card</div>
    <div class="navrow"><button id="cPrev" aria-label="Previous">◀</button><button id="cNext" aria-label="Next">▶</button></div>
    <div class="tools">
      <button class="btn" id="cShuf">🔀 Shuffle</button>
      <button class="btn" id="cDir"></button>
      <button class="btn" id="cSay">🔊 Hear German</button>
    </div>

    <details class="manage-wrap" id="cManage">
      <summary>⚙️ Manage flashcards <small id="cTotal"></small></summary>
      <div class="panel">
      <div class="panel-h"><h2>Card list</h2></div>
      <div class="row2">
        <input id="cNewEn" placeholder="English" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input id="cNewDe" placeholder="Deutsch" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button class="icon" id="cAdd" aria-label="Add card" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">＋</button>
      </div>
      <div id="cList"></div>
      <details>
        <summary>Add many at once</summary>
        <textarea id="cBulk" placeholder="One card per line:&#10;the house = das Haus&#10;to live = wohnen"></textarea>
        <div class="actions"><button class="btn" id="cBulkAdd">Add lines</button></div>
      </details>
      <div class="actions">
        <button class="btn" id="cCopy">📋 Copy list</button>
        <button class="btn danger" id="cClear">Delete all</button>
      </div>
      </div>
    </details>
  </section>
</div>

<nav class="tabs"><div class="in">
  <button class="tab-btn" data-t="wheel"><span>🎡</span>Wheel</button>
  <button class="tab-btn" data-t="dice"><span>🎲</span>Dice</button>
  <button class="tab-btn" data-t="cards"><span>🃏</span>Cards</button>
</div></nav>

<div class="modal hidden" id="resModal">
  <div class="sheet">
    <div class="lab">🎯 Picked</div>
    <div class="big" id="resText"></div>
    <div class="left" id="resLeft"></div>
    <button class="go sec" id="resSay">🔊 Hear it</button>
    <button class="go sec hidden" id="resRestore">↩ Restore all options</button>
    <button class="go" id="resOk">OK</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const TAU = Math.PI*2, mod = (a, n) => ((a % n) + n) % n;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const vib = () => { try { navigator.vibrate && navigator.vibrate(25); } catch(e) {} };
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

function speak(text){
  if (!hasTTS || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
function copyText(text){
  const done = () => toast('Copied ✓');
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { toast('Copy not available here'); }
    ta.remove();
  }
}
// two-tap confirm instead of confirm() dialogs
function armed(btn, label, fn){
  btn.addEventListener('click', () => {
    if (btn.dataset.armed) { clearTimeout(btn._t); delete btn.dataset.armed; btn.textContent = label; fn(); }
    else { btn.dataset.armed = 1; btn.textContent = 'Tap again to confirm'; btn._t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 3000); }
  });
}

// ---------- saved data ----------
const prefs = Object.assign({tab:'wheel', elim:true, dice:2, dir:'en'}, load('tk_prefs', {}));
let items = load('tk_wheel', null) || ['wohnen','heißen','leben','sprechen','kommen','machen','lernen','arbeiten'].map(text => ({id:uid(), text}));
let done  = load('tk_done', []);
let cards = load('tk_cards', null) || [
  ['the house','das Haus'],['to live','wohnen'],['the friend','der Freund'],['thank you','danke'],['good morning','guten Morgen'],['the water','das Wasser']
].map(([en, de]) => ({id:uid(), en, de}));
const saveAll = () => { save('tk_prefs', prefs); save('tk_wheel', items); save('tk_done', done); save('tk_cards', cards); };

// ---------- tabs ----------
function showTab(t){
  prefs.tab = t; save('tk_prefs', prefs);
  ['wheel','dice','cards'].forEach(n => $('tab-' + n).classList.toggle('hidden', n !== t));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  window.scrollTo(0, 0);
  if (t === 'wheel') requestAnimationFrame(drawWheel);
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.t)));

// =====================================================================
//  WHEEL
// =====================================================================
const PAL = ['#e5484d','#3e63dd','#30a46c','#e08a00','#8e4ec6','#12a594','#e93d82','#f76b15'];
let rot = 0, spinning = false;

function fitText(ctx, txt, maxW, fs){
  ctx.font = `700 ${fs}px system-ui, sans-serif`;
  while (ctx.measureText(txt).width > maxW && fs > 10) { fs--; ctx.font = `700 ${fs}px system-ui, sans-serif`; }
  if (ctx.measureText(txt).width > maxW) {
    while (txt.length > 1 && ctx.measureText(txt + '…').width > maxW) txt = txt.slice(0, -1);
    txt += '…';
  }
  return txt;
}

function drawWheel(){
  const c = $('wheel'), size = c.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = size * dpr; c.height = size * dpr;
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  const r = size/2 - 8, n = items.length;
  ctx.save(); ctx.translate(size/2, size/2);

  if (!n) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--line'); ctx.fill();
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted');
    ctx.font = '700 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(done.length ? 'All done 🎉' : 'Add some options', 0, -40);
    ctx.restore(); return;
  }

  const seg = TAU / n;
  ctx.rotate(rot);
  for (let i = 0; i < n; i++) {
    let col = PAL[i % PAL.length];
    if (n > 1 && i === n - 1 && i % PAL.length === 0) col = PAL[3];   // avoid same colour at the seam
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i*seg, (i+1)*seg); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();

    ctx.save();
    ctx.rotate(i*seg + seg/2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3;
    const fs = Math.max(10, Math.min(r*0.12, seg*r*0.45, 28));
    const txt = fitText(ctx, items[i].text, r*0.68, fs);
    ctx.fillText(txt, r - 16, 0);
    ctx.restore();
  }
  ctx.restore();

  // rim
  ctx.beginPath(); ctx.arc(size/2, size/2, r, 0, TAU);
  ctx.lineWidth = 4; ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink'); ctx.stroke();
}

function renderWheelUI(){
  $('wStat').textContent = `${items.length} left · ${done.length} picked`;
  $('wCount').textContent = `(${items.length})`;
  $('dCount').textContent = `(${done.length})`;
  $('wList').innerHTML = items.length
    ? items.map(it => `<div class="row" data-id="${it.id}"><input value="${esc(it.text)}" aria-label="Option text" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="icon del" aria-label="Delete">🗑</button></div>`).join('')
    : '<p class="empty">No options on the wheel.</p>';
  $('wDone').innerHTML = done.length
    ? done.map(it => `<span class="pill" data-id="${it.id}">${esc(it.text)}<button aria-label="Put back">↩</button></span>`).join('')
    : '<p class="empty" style="margin:0">Nothing picked yet.</p>';
  $('wDonePanel').classList.toggle('hidden', !done.length);
  $('spinBtn').disabled = spinning || !items.length;
  $('hub').disabled = spinning || !items.length;
  $('wPanel').classList.toggle('disabled', spinning);
  $('wDonePanel').classList.toggle('disabled', spinning);
}
function wheelChanged(){ saveAll(); renderWheelUI(); drawWheel(); }

function addOption(text){
  text = text.trim(); if (!text) return false;
  items.push({id:uid(), text}); wheelChanged(); return true;
}
$('wAdd').addEventListener('click', () => { if (addOption($('wNew').value)) { $('wNew').value = ''; $('wNew').focus(); } });
$('wNew').addEventListener('keydown', e => { if (e.key === 'Enter') $('wAdd').click(); });
$('wBulkAdd').addEventListener('click', () => {
  const lines = $('wBulk').value.split('\n').map(s => s.trim()).filter(Boolean);
  lines.forEach(t => items.push({id:uid(), text:t}));
  if (lines.length) { $('wBulk').value = ''; wheelChanged(); toast(`${lines.length} added`); }
});
$('wList').addEventListener('change', e => {
  const row = e.target.closest('.row'); if (!row || e.target.tagName !== 'INPUT') return;
  const it = items.find(x => x.id === row.dataset.id); if (!it) return;
  const v = e.target.value.trim();
  if (v) it.text = v;
  wheelChanged();
});
$('wList').addEventListener('click', e => {
  const del = e.target.closest('.del'); if (!del) return;
  const id = del.closest('.row').dataset.id;
  items = items.filter(x => x.id !== id); wheelChanged();
});
$('wDone').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.closest('.pill').dataset.id, it = done.find(x => x.id === id);
  if (it) { done = done.filter(x => x.id !== id); items.push(it); wheelChanged(); }
});
$('wRestore').addEventListener('click', restoreAll);
function restoreAll(){ items.push(...done); done = []; wheelChanged(); }
$('wCopy').addEventListener('click', () => copyText(items.map(i => i.text).join('\n')));
armed($('wClear'), 'Clear all', () => { items = []; done = []; wheelChanged(); });
$('elim').checked = !!prefs.elim;
$('elim').addEventListener('change', e => { prefs.elim = e.target.checked; save('tk_prefs', prefs); });

function spin(){
  if (spinning || !items.length) return;
  spinning = true; renderWheelUI();
  const n = items.length, seg = TAU / n, win = rnd(n), chosen = items[win];
  const local = (win + .12 + Math.random()*.76) * seg;        // angle inside the wheel that ends under the pointer
  const finalMod = mod(-Math.PI/2 - local, TAU);
  const start = rot, end = rot + mod(finalMod - rot, TAU) + TAU * (5 + rnd(3));
  const dur = 4200 + Math.random()*1300, t0 = performance.now();
  (function frame(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    rot = start + (end - start) * e; drawWheel();
    if (p < 1) requestAnimationFrame(frame); else finishSpin(chosen);
  })(t0);
}
function finishSpin(chosen){
  spinning = false; rot = mod(rot, TAU); vib();
  const idx = items.findIndex(x => x.id === chosen.id);
  if (prefs.elim && idx > -1) { items.splice(idx, 1); done.push(chosen); }
  saveAll(); renderWheelUI(); drawWheel();
  $('resText').textContent = chosen.text;
  const left = items.length;
  $('resLeft').textContent = prefs.elim ? (left ? `${left} left on the wheel` : 'That was the last one! 🎉') : '';
  $('resRestore').classList.toggle('hidden', !(prefs.elim && !left));
  $('resSay').classList.toggle('hidden', !hasTTS);
  $('resModal').classList.remove('hidden');
}
$('spinBtn').addEventListener('click', spin);
$('hub').addEventListener('click', spin);
$('resOk').addEventListener('click', () => $('resModal').classList.add('hidden'));
$('resRestore').addEventListener('click', () => { restoreAll(); $('resModal').classList.add('hidden'); });
$('resSay').addEventListener('click', () => speak($('resText').textContent));
$('resModal').addEventListener('click', e => { if (e.target === $('resModal')) $('resModal').classList.add('hidden'); });
window.addEventListener('resize', () => { if (!$('tab-wheel').classList.contains('hidden')) drawWheel(); });

// =====================================================================
//  DICE
// =====================================================================
const PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
let rolling = false, hist = [];
function setDie(id, v){
  $(id).dataset.v = v; $(id).setAttribute('aria-label', 'Die showing ' + v);
  $(id).innerHTML = Array.from({length:9}, (_, i) => `<span class="pip${PIPS[v].includes(i) ? ' on' : ''}"></span>`).join('');
}
function renderDiceMode(){
  document.querySelectorAll('#diceCount button').forEach(b => b.classList.toggle('on', +b.dataset.n === prefs.dice));
  $('die2').classList.toggle('hidden', prefs.dice === 1);
  $('diceTotal').textContent = '';
}
async function rollDice(){
  if (rolling) return;
  rolling = true; $('rollBtn').disabled = true; $('diceTotal').textContent = '';
  const ids = ['die1','die2'].slice(0, prefs.dice);
  const finals = ids.map(() => 1 + rnd(6));
  const ticks = ids.map(id => { $(id).classList.remove('land'); $(id).classList.add('rolling'); return setInterval(() => setDie(id, 1 + rnd(6)), 80); });
  await Promise.all(ids.map(async (id, i) => {
    await sleep(900 + i*300);
    clearInterval(ticks[i]); setDie(id, finals[i]);
    $(id).classList.remove('rolling'); void $(id).offsetWidth; $(id).classList.add('land'); vib();
  }));
  const sum = finals.reduce((a, b) => a + b, 0);
  if (finals.length === 2) {
    $('diceTotal').textContent = `${finals[0]} + ${finals[1]} = ${sum}` + (finals[0] === finals[1] ? '  🎉 Double!' : '');
    hist.unshift(`${finals[0]}+${finals[1]}=${sum}`);
  } else {
    $('diceTotal').textContent = `You rolled ${sum}`;
    hist.unshift(String(sum));
  }
  hist = hist.slice(0, 12);
  $('hist').innerHTML = hist.map(h => `<span>${h}</span>`).join('');
  rolling = false; $('rollBtn').disabled = false;
}
$('rollBtn').addEventListener('click', rollDice);
$('die1').addEventListener('click', rollDice);
$('die2').addEventListener('click', rollDice);
$('diceCount').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || rolling) return;
  prefs.dice = +b.dataset.n; save('tk_prefs', prefs); renderDiceMode();
});
setDie('die1', 5); setDie('die2', 2); renderDiceMode();

// =====================================================================
//  FLASHCARDS
// =====================================================================
let deck = cards.slice(), idx = 0, flipped = false;

function syncDeck(){
  const map = new Map(cards.map(c => [c.id, c]));
  const kept = deck.filter(c => map.has(c.id)).map(c => map.get(c.id));
  const have = new Set(kept.map(c => c.id));
  deck = kept.concat(cards.filter(c => !have.has(c.id)));
  if (idx >= deck.length) idx = Math.max(0, deck.length - 1);
}
function renderCard(){
  const n = deck.length, c = deck[idx];
  $('flip').classList.remove('flip'); flipped = false;
  $('cDir').textContent = prefs.dir === 'en' ? '🔁 English → Deutsch' : '🔁 Deutsch → English';
  $('cSay').classList.toggle('hidden', !hasTTS);
  if (!n) {
    $('cCount').textContent = 'No cards yet';
    $('cBar').style.width = '0';
    $('fLab').textContent = ''; $('fTxt').textContent = 'Add a card below ⬇️';
    $('bLab').textContent = ''; $('bTxt').textContent = '';
    return;
  }
  $('cCount').textContent = `${idx + 1} / ${n}`;
  $('cBar').style.width = ((idx + 1) / n * 100) + '%';
  const enFirst = prefs.dir === 'en';
  $('fLab').textContent = enFirst ? 'English' : 'Deutsch';
  $('fTxt').textContent = enFirst ? c.en : c.de;
  $('bLab').textContent = enFirst ? 'Deutsch' : 'English';
  $('bTxt').textContent = enFirst ? c.de : c.en;
}
function flip(){
  if (!deck.length) return;
  flipped = !flipped; $('flip').classList.toggle('flip', flipped);
}
async function go(d){
  if (!deck.length) return;
  idx = mod(idx + d, deck.length);
  if (flipped) { flipped = false; $('flip').classList.remove('flip'); await sleep(200); }   // flip back before changing the text
  renderCard();
}
function renderCardList(){
  $('cTotal').textContent = `(${cards.length})`;
  $('cList').innerHTML = cards.length
    ? cards.map(c => `<div class="row2" data-id="${c.id}"><input class="en" value="${esc(c.en)}" placeholder="English" aria-label="English" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="de" value="${esc(c.de)}" placeholder="Deutsch" aria-label="Deutsch" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="icon del" aria-label="Delete">🗑</button></div>`).join('')
    : '<p class="empty">No cards yet.</p>';
}
function cardsChanged(rerender = true){ saveAll(); syncDeck(); renderCardList(); if (rerender) renderCard(); }

function addCard(en, de){
  en = en.trim(); de = de.trim(); if (!en || !de) return false;
  cards.push({id:uid(), en, de}); cardsChanged(); return true;
}
$('cAdd').addEventListener('click', () => {
  if (!$('cNewEn').value.trim() || !$('cNewDe').value.trim()) { toast('Fill in both English and Deutsch'); return; }
  addCard($('cNewEn').value, $('cNewDe').value);
  $('cNewEn').value = ''; $('cNewDe').value = ''; $('cNewEn').focus();
});
$('cNewDe').addEventListener('keydown', e => { if (e.key === 'Enter') $('cAdd').click(); });
$('cNewEn').addEventListener('keydown', e => { if (e.key === 'Enter') $('cNewDe').focus(); });
$('cBulkAdd').addEventListener('click', () => {
  let n = 0;
  $('cBulk').value.split('\n').forEach(line => {
    const m = line.trim().match(/^(.+?)\s*(?:=|\t|;|\s-\s|,)\s*(.+)$/);
    if (m) { cards.push({id:uid(), en:m[1].trim(), de:m[2].trim()}); n++; }
  });
  if (n) { $('cBulk').value = ''; cardsChanged(); toast(`${n} added`); } else toast('Use the format: English = Deutsch');
});
$('cList').addEventListener('change', e => {
  const row = e.target.closest('.row2'); if (!row || e.target.tagName !== 'INPUT') return;
  const c = cards.find(x => x.id === row.dataset.id); if (!c) return;
  const v = e.target.value.trim();
  if (v) c[e.target.classList.contains('en') ? 'en' : 'de'] = v;
  cardsChanged();
});
$('cList').addEventListener('click', e => {
  const del = e.target.closest('.del'); if (!del) return;
  const id = del.closest('.row2').dataset.id;
  cards = cards.filter(x => x.id !== id); cardsChanged();
});
$('cCopy').addEventListener('click', () => copyText(cards.map(c => `${c.en} = ${c.de}`).join('\n')));
armed($('cClear'), 'Delete all', () => { cards = []; deck = []; idx = 0; cardsChanged(); });

$('cNext').addEventListener('click', () => go(1));
$('cPrev').addEventListener('click', () => go(-1));
$('cShuf').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) { const j = rnd(i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  idx = 0; renderCard(); toast('Shuffled 🔀');
});
$('cDir').addEventListener('click', () => { prefs.dir = prefs.dir === 'en' ? 'de' : 'en'; save('tk_prefs', prefs); renderCard(); });
$('cSay').addEventListener('click', () => { if (deck[idx]) speak(deck[idx].de); });

// tap = flip, swipe = next / previous
let px = 0, py = 0, pActive = false;
$('flip').addEventListener('pointerdown', e => { px = e.clientX; py = e.clientY; pActive = true; });
$('flip').addEventListener('pointercancel', () => { pActive = false; });
$('flip').addEventListener('pointerup', e => {
  if (!pActive) return; pActive = false;
  const dx = e.clientX - px, dy = e.clientY - py;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) flip();
});
document.addEventListener('keydown', e => {
  if ($('tab-cards').classList.contains('hidden') || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); flip(); }
});

// ---------- start ----------
renderWheelUI(); renderCardList(); renderCard();
showTab(['wheel','dice','cards'].includes(prefs.tab) ? prefs.tab : 'wheel');
try { hasTTS && speechSynthesis.getVoices(); } catch(e) {}
</script>
