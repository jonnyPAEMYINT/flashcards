<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>German Flashcards</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/icon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="img/icon/favicon.svg" />
  <link rel="shortcut icon" href="img/icon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="JPM" />
  <link rel="manifest" href="img/icon/site.webmanifest" />

  <script>
    try {
      var t = JSON.parse(localStorage.getItem('dl.settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Deferred scripts run in order after the page is parsed.
       main.js works without confetti (it checks for it first). -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>

  <div class="wrapper">
    <h1 lang="de">Es macht Spaß, Deutsch zu lernen</h1>

    <div class="topbar">
      <div id="stats" aria-live="polite"></div>
      <!-- "Study today" (due + new cards), "Review N" once the goal is met, "Exit session" while running -->
      <button type="button" id="review-due" class="secondary" hidden>Study today</button>
    </div>
    <div id="notice" role="status"></div>

    <label class="sr-only" for="main-category">Category</label>
    <select id="main-category">
    </select>

    <label class="sr-only" for="sub-category">Topic</label>
    <select id="sub-category"></select>

    <!-- STUDY MODE -->
    <section id="study" aria-label="Flashcards">
      <div class="card-container">
        <button id="tts-btn" type="button" aria-label="Play pronunciation">🔊</button>

        <div class="card" id="flashcard" role="button" tabindex="0" lang="de"
             aria-live="polite" aria-label="Flashcard. Tap or press space to flip.">
          <span id="card-text"></span>
          <small id="card-example" hidden></small>
        </div>

        <div class="progress-row">
          <input type="range" id="card-slider" min="0" max="0" value="0" aria-label="Card position" />
          <div id="card-count">0/0</div>
        </div>
      </div>

      <!-- One shared spot: "Show answer" until the answer has been seen, then the four ratings -->
      <div class="actions">
        <button type="button" id="show-answer">Show answer</button>
        <div id="rating" hidden>
          <button type="button" data-rate="1" aria-label="Again (key 1)">Again</button>
          <button type="button" data-rate="2" aria-label="Hard (key 2)">Hard</button>
          <button type="button" data-rate="3" aria-label="Good (key 3)">Good</button>
          <button type="button" data-rate="4" aria-label="Easy (key 4)">Easy</button>
        </div>
      </div>

      <!-- Shown at the end of a batch / deck / review -->
      <div id="batch-actions" hidden>
        <button type="button" id="repeat-batch" hidden>Repeat</button>
        <button type="button" id="next-batch" hidden>Next batch</button>
        <button type="button" id="start-quiz" hidden>Start Quiz</button>
        <button type="button" id="exit-review" hidden>Back to lesson</button>
      </div>
    </section>

    <!-- QUIZ MODE -->
    <section class="quiz-container" id="quiz-container" hidden aria-label="Quiz">
      <h2>Quiz Mode</h2>

      <label class="sr-only" for="quiz-type">Quiz type</label>
      <select id="quiz-type">
        <option value="choice">Multiple choice</option>
        <option value="typing">Typing: see the English, type the German</option>
      </select>

      <div id="quiz-progress"></div>
      <div id="quiz-question" lang="de"></div>

      <div class="quiz-options" id="quiz-options" role="group" aria-label="Answers"></div>

      <form id="quiz-type-form" hidden autocomplete="off">
        <input id="quiz-input" type="text" lang="de" autocapitalize="off"
               autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer" />
        <div id="umlaut-bar">
          <button type="button" data-char="ä">ä</button>
          <button type="button" data-char="ö">ö</button>
          <button type="button" data-char="ü">ü</button>
          <button type="button" data-char="ß">ß</button>
        </div>
        <button type="submit" id="quiz-check">Check</button>
      </form>

      <div id="quiz-feedback" aria-live="assertive"></div>

      <div class="quiz-controls">
        <button type="button" id="quiz-next">Skip</button>
        <button type="button" id="quiz-exit" class="secondary">Exit Quiz</button>
      </div>

      <div id="quiz-result" hidden>
        <p id="quiz-summary"></p>
        <ul id="quiz-wrong-list"></ul>
        <button type="button" id="quiz-retry">Practise mistakes</button>
      </div>
    </section>

    <!-- Settings -->
    <details class="settings" id="settings">
      <summary>⚙ Settings</summary>

      <div class="set-group">
        <h3>Study</h3>
        <label class="setting-row">
          <span>Daily goal</span>
          <select id="daily-goal" aria-label="Daily goal in cards">
            <option value="10">10 cards</option>
            <option value="20">20 cards</option>
            <option value="30">30 cards</option>
            <option value="50">50 cards</option>
            <option value="100">100 cards</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Reverse <small>answer side first</small></span>
          <input type="checkbox" id="reverse" class="switch" />
        </label>
        <div class="setting-row">
          <span>Card order</span>
          <div class="button-group">
            <button type="button" id="shuffle" class="chip">Shuffle</button>
            <button type="button" id="restart" class="chip">Restart</button>
          </div>
        </div>
      </div>

      <div class="set-group">
        <h3>Audio</h3>
        <label class="setting-row">
          <span>Auto-play German <small>needs a German voice</small></span>
          <input type="checkbox" id="autoplay" class="switch" />
        </label>
        <div class="setting-row">
          <span>Check audio</span>
          <button type="button" id="test-audio" class="chip">Test</button>
        </div>
        <p class="hint-text" id="voice-status"></p>
      </div>

      <div class="set-group">
        <h3>Appearance</h3>
        <label class="setting-row">
          <span>Theme</span>
          <select id="theme" aria-label="Theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>

      <p class="hint-text">Keys: ← → move · Space show · 1–4 rate · U undo · S speak</p>
    </details>
  </div>

  <footer>
    Developed with ❤️ by JPM. &copy; <span id="year">2026</span>
  </footer>

  <!-- Undo toast for the last rating -->
  <div id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

</body>
</html>
