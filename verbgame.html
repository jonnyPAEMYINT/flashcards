<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb Dice</title>
<style>
:root{--bg:#f4f1ea;--card:#ffffff;--ink:#1d2433;--muted:#6b7385;--line:#e2ddd0;--accent:#2f5bea;--accent-ink:#fff}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171f;--card:#1e2330;--ink:#eef0f6;--muted:#9aa2b6;--line:#2c3345;--accent:#7b9bff;--accent-ink:#0f1320}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{width:100%;max-width:480px}
.dice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.die{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 6px 8px;position:relative;cursor:pointer}
.die .lab{position:absolute;top:10px;left:0;right:0;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.die .face{font-weight:800;font-size:clamp(1.8rem,10vw,3rem);line-height:1.1;overflow-wrap:anywhere}
.die.verb .face{font-size:clamp(1.15rem,6vw,1.8rem)}
.die .sub{font-size:.85rem;color:var(--muted);min-height:1.2em;margin-top:6px}
.die.rolling{animation:tumble .45s linear infinite;border-color:var(--accent)}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-12deg) translateY(-9px)}50%{transform:rotate(10deg) translateY(0)}75%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(0) translateY(0)}}
.die.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.18) rotate(7deg)}100%{transform:scale(1) rotate(0)}}
.go{width:100%;min-height:58px;margin-top:22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6}
</style>
</head>
<body>
<div class="app">
  <div class="dice">
    <div class="die" id="d1"><span class="lab">Subject</span><div class="face" id="f1">?</div><div class="sub" id="s1"></div></div>
    <div class="die verb" id="d2"><span class="lab">Verb</span><div class="face" id="f2">?</div><div class="sub" id="s2"></div></div>
  </div>
  <button class="go" id="roll">🎲 Roll the dice</button>
</div>

<script>
const VERBS = [
  ['wohnen','to live (reside)'],['heißen','to be called'],['leben','to live (be alive)'],['sprechen','to speak'],
  ['kommen','to come'],['machen','to do / make'],['lernen','to learn'],['arbeiten','to work'],
  ['spielen','to play'],['trinken','to drink'],['essen','to eat'],['fahren','to drive / go (by vehicle)'],
  ['haben','to have'],['sein','to be'],['gehen','to go'],['lesen','to read'],
  ['sehen','to see'],['schlafen','to sleep'],['kochen','to cook'],['kaufen','to buy'],['studieren','to study (at uni)']
];
const PRON = [
  ['ich',''],['du',''],['er',''],['sie','she'],['ihr',''],['wir',''],['sie','they'],['Sie','formal you']
];
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
let rolling = false, started = false, lastVerb = -1;

function roll(){
  if (rolling) return;
  rolling = true;
  $('roll').disabled = true;

  let vi; do { vi = rnd(VERBS.length); } while (vi === lastVerb);
  lastVerb = vi;
  const p = PRON[rnd(PRON.length)], v = VERBS[vi];

  const done = [false, false];
  ['d1','d2'].forEach(id => { $(id).classList.remove('land'); $(id).classList.add('rolling'); });
  $('s1').textContent = ''; $('s2').textContent = '';

  const spin = setInterval(() => {
    if (!done[0]) $('f1').textContent = PRON[rnd(PRON.length)][0];
    if (!done[1]) $('f2').textContent = VERBS[rnd(VERBS.length)][0];
  }, 75);

  const land = k => {
    done[k] = true;
    const d = $('d' + (k+1));
    d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('land');
    if (k === 0) { $('f1').textContent = p[0]; $('s1').textContent = p[1] ? '(' + p[1] + ')' : ''; }
    else { $('f2').textContent = v[0]; $('s2').textContent = v[1]; }
    try { navigator.vibrate && navigator.vibrate(25); } catch(e) {}
    if (done.every(Boolean)) {
      clearInterval(spin); rolling = false; started = true;
      $('roll').disabled = false; $('roll').textContent = '🎲 Roll again';
    }
  };
  setTimeout(() => land(0), 850);
  setTimeout(() => land(1), 1200);
}

$('roll').addEventListener('click', roll);
document.querySelectorAll('.die').forEach(d => d.addEventListener('click', roll));
</script>
</body>
</html>
