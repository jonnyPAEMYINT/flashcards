<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRS German Flashcards</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/icon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="img/icon/favicon.svg" />
  <link rel="shortcut icon" href="img/icon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/icon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="JPM" />
  <link rel="manifest" href="img/icon/site.webmanifest" />

  <link rel="stylesheet" href="css/srsstyle.css" /> 
  <script type="text/javascript" src="js/srsmain.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KE1FPSFJT1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KE1FPSFJT1');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="wrapper">
      <h1>Es macht Spaß, Deutsch zu lernen</h1>

      <!-- First dropdown: main category -->
      <select id="main-category">
        <option value="phrases">Phrases</option>
        <option value="vocabulary">Vocabulary</option>
        <option value="verbs">Verbs</option>
        <option value="word_relationships">Word Relationships</option>
        <option value="situations">Situations</option>
        <option value="challenge">30 days challenge</option>
        <option value="sicher">Schritte & Sicher (Lernwortschatz)</option>
      </select>

      <!-- Second dropdown: subcategory (populated dynamically) -->
      <select id="sub-category"></select>

      <!-- Flashcard container (same as before) -->
      <div class="card-container">
        <button id="tts-btn" aria-label="Play pronunciation">🔊</button>
        <div class="card" id="flashcard">
          <div class="front">Front Content</div>
          <div class="back">Back Content</div>
        </div>

        <!--
        <div class="card-stats">
          <span id="total-cards">Total: 0</span> |
          <span id="learnt-cards">Learnt: 0</span> |
          <span id="remaining-cards">Remaining: 0</span>
        </div>-->

        <div id="progress-info">
          <span id="new-count" style="color:blue">0</span> +
          <span id="learning-count" style="color:red">0</span> +
          <span id="review-count" style="color:green">0</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- SRS buttons -->
        <div class="srs-buttons">
          <button class="again" id="btnAgain">Again</button>
          <button class="hard" id="btnHard">Hard</button>
          <button class="good" id="btnGood">Good</button>
          <button class="easy" id="btnEasy">Easy</button>
        </div>
      </div>

    </div>
      
    <footer>
      Developed with ❤️ by JPM. &copy; <span id="year">2025</span>
    </footer>
  
</body>
</html>
